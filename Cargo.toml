[workspace]
members = [
    "crates/forgedb",
    "crates/forgedb-core",
    "crates/forgedb-fs",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
authors = ["ForgeDB contributors"]
license = "MIT"
repository = "https://github.com/Onmaynec/ForgeDB"
homepage = "https://github.com/Onmaynec/ForgeDB"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
