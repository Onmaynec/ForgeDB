name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate_obsolete_lifetime:
    name: integrate reference-aware obsolete lifetime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v0.4.0-leveled-compaction
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply lifetime integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def find_line(lines, predicate, label, start=0, end=None):
              stop = len(lines) if end is None else end
              matches = [i for i in range(start, stop) if predicate(lines[i])]
              if len(matches) != 1:
                  raise SystemExit(f"{label}: expected one line, found {len(matches)}")
              return matches[0]

          database = Path("crates/forgedb/src/database_v3_fixed.rs")
          lines = database.read_text().splitlines()
          index = find_line(
              lines,
              lambda line: line.strip() == "fatal_write_error: Option<String>,",
              "DatabaseState fatal field",
          )
          lines.insert(index + 1, "    obsolete_versions: Vec<ObsoleteVersion>,")
          index = find_line(
              lines,
              lambda line: line.strip() == "fatal_write_error: None,",
              "DatabaseState fatal init",
          )
          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
          lines.insert(index + 1, f"{indent}obsolete_versions: Vec::new(),")

          inventory_start = find_line(
              lines,
              lambda line: "pub fn file_inventory(&self)" in line,
              "file_inventory method",
          )
          verify_start = find_line(
              lines,
              lambda line: "pub fn verify(&self" in line,
              "verify method",
              start=inventory_start + 1,
          )
          index = find_line(
              lines,
              lambda line: line.strip() == "let state = self.lock_state()?;",
              "file_inventory state lock",
              start=inventory_start,
              end=verify_start,
          )
          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
          lines[index] = f"{indent}let mut state = self.lock_state()?;"
          lines.insert(index + 1, f"{indent}self.collect_obsolete_ssts_locked(&mut state)?;")

          close_start = find_line(
              lines,
              lambda line: "pub fn close(&self)" in line,
              "close method",
          )
          path_start = find_line(
              lines,
              lambda line: "pub const fn identity(&self)" in line,
              "identity method",
              start=close_start + 1,
          )
          index = find_line(
              lines,
              lambda line: line.strip() == "state.lock.take();",
              "close lock release",
              start=close_start,
              end=path_start,
          )
          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
          lines.insert(index, f"{indent}self.collect_obsolete_ssts_locked(&mut state)?;")
          database.write_text("\n".join(lines) + "\n")

          cursor = Path("crates/forgedb/src/sst_entry_cursor.rs")
          lines = cursor.read_text().splitlines()
          index = find_line(
              lines,
              lambda line: line == "use std::path::{Path, PathBuf};",
              "cursor path import",
          )
          lines.insert(index + 1, "use std::sync::Arc;")
          index = find_line(
              lines,
              lambda line: line == "use crate::entry_cursor::EntryCursor;",
              "cursor EntryCursor import",
          )
          lines.insert(index + 1, "use crate::version_set::VersionSet;")
          index = find_line(
              lines,
              lambda line: line.strip() == "finished: bool,",
              "cursor finished field",
          )
          lines.insert(index + 1, "    _version_lease: Option<Arc<VersionSet>>,")
          index = find_line(
              lines,
              lambda line: line.strip() == "finished: false,",
              "cursor finished init",
          )
          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
          lines.insert(index + 1, f"{indent}_version_lease: None,")
          index = find_line(
              lines,
              lambda line: line.strip() == "fn load_next_block(&mut self) -> Result<()> {",
              "cursor load_next_block",
          )
          method = [
              "    pub(crate) fn with_version_lease(mut self, lease: Arc<VersionSet>) -> Self {",
              "        self._version_lease = Some(lease);",
              "        self",
              "    }",
              "",
          ]
          lines[index:index] = method
          cursor.write_text("\n".join(lines) + "\n")

          wrapper = Path("crates/forgedb/src/database_streaming_wrapper.rs")
          lines = wrapper.read_text().splitlines()
          index = find_line(
              lines,
              lambda line: line.strip() == "read_options.verify_checksums,",
              "streaming checksum argument",
          )
          if lines[index + 1].strip() != ")?;":
              raise SystemExit("streaming cursor call terminator not found")
          indent = lines[index + 1][: len(lines[index + 1]) - len(lines[index + 1].lstrip())]
          lines[index + 1] = f"{indent})?"
          lines.insert(index + 2, f"{indent}.with_version_lease(Arc::clone(&version));")
          wrapper.write_text("\n".join(lines) + "\n")

          compaction = Path("crates/forgedb/src/database_compaction.rs")
          lines = compaction.read_text().splitlines()
          index = find_line(
              lines,
              lambda line: line.strip() == "let next_version = state.version.with_compaction(",
              "next Version construction",
          )
          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
          lines[index] = f"{indent}let next_version = previous_version.with_compaction("
          lines.insert(index, f"{indent}let previous_version = Arc::clone(&state.version);")

          index = find_line(
              lines,
              lambda line: line.strip() == "let installation = VersionEditV2 {",
              "installation edit",
          )
          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
          block = [
              f"{indent}let obsolete_files = plan",
              f"{indent}    .source_files",
              f"{indent}    .iter()",
              f"{indent}    .chain(plan.output_level_files.iter())",
              f"{indent}    .copied()",
              f"{indent}    .collect::<Vec<_>>();",
          ]
          lines[index:index] = block

          index = find_line(
              lines,
              lambda line: line.strip() == "state.version = Arc::new(next_version);",
              "current Version swap",
          )
          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
          lines.insert(index, f"{indent}let obsolete = ObsoleteVersion::new(&previous_version, obsolete_files)?;")
          lines[index + 2:index + 2] = [
              f"{indent}state.obsolete_versions.push(obsolete);",
              f"{indent}drop(previous_version);",
              f"{indent}self.collect_obsolete_ssts_locked(&mut state)?;",
          ]

          index = find_line(
              lines,
              lambda line: line.strip() == "assert_eq!(inventory.orphan_sst.len(), 2);",
              "immediate cleanup assertion",
          )
          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
          lines[index] = f"{indent}assert!(inventory.orphan_sst.is_empty());"

          test = [
              "",
              "    #[test]",
              "    fn active_streaming_scan_defers_input_deletion_until_iterator_drop() -> Result<()> {",
              "        let directory = temporary_directory(\"active-scan-lifetime\")?;",
              "        let database = StreamingDatabase::open(&directory, compaction_options())?;",
              "        database.put(b\"alpha\", b\"old\", WriteOptions::sync())?;",
              "        database.flush()?;",
              "        database.put(b\"alpha\", b\"new\", WriteOptions::sync())?;",
              "        database.put(b\"beta\", b\"value\", WriteOptions::sync())?;",
              "        database.flush()?;",
              "",
              "        let iterator = database.scan(.., ReadOptions::default())?;",
              "        database.compact_range(None, None)?;",
              "        assert_eq!(database.file_inventory()?.orphan_sst.len(), 2);",
              "",
              "        drop(iterator);",
              "        assert!(database.file_inventory()?.orphan_sst.is_empty());",
              "        database.close()?;",
              "        fs::remove_dir_all(&directory).map_err(|source| {",
              "            Error::io(\"remove_test_directory\", Some(directory), source)",
              "        })?;",
              "        Ok(())",
              "    }",
          ]
          module_end = len(lines) - 1
          if lines[module_end].strip() != "}":
              raise SystemExit("database compaction module end not found")
          lines[module_end:module_end] = test
          compaction.write_text("\n".join(lines) + "\n")
          PY
      - run: cargo fmt --all
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --doc
      - run: cargo build --locked --workspace --release
      - name: Commit lifetime integration
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/forgedb/src
          git commit -m "feat(v0.4): defer obsolete SST deletion until readers release versions"
          git push origin HEAD:feature/v0.4.0-leveled-compaction
