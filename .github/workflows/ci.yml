name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  refactor-sstable-builder:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/v0.2.0-sstable-flush'
    name: refactor strict SSTable builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Introduce TableBuildRequest and rewrite call sites
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("crates")
          sstable = Path("crates/forgedb-sstable/src/lib.rs")
          text = sstable.read_text()

          old_clone = "            limits: limits.clone(),"
          new_clone = "            limits: *limits,"
          if old_clone in text:
              text = text.replace(old_clone, new_clone, 1)
          elif new_clone not in text:
              raise SystemExit("Limits clone location not found")

          marker = "/// Persisted metadata одного L0 SSTable, хранимая в MANIFEST."
          request_type = '''/// Полный запрос на физическое построение одного SSTable V1.
          ///
          /// Тип объединяет неизменяемые входы builder и не позволяет перепутать
          /// каталог базы, временный каталог, identity или номер файла.
          pub struct TableBuildRequest<'a> {
              database_directory: &'a Path,
              temporary_directory: &'a Path,
              database_id: DatabaseId,
              file_number: u64,
              entries: &'a [TableEntry],
              limits: &'a Limits,
              options: TableBuildOptions,
          }

          impl<'a> TableBuildRequest<'a> {
              /// Создаёт полностью типизированный запрос к SSTable builder.
              #[must_use]
              pub fn new(
                  database_directory: &'a Path,
                  temporary_directory: &'a Path,
                  database_id: DatabaseId,
                  file_number: u64,
                  entries: &'a [TableEntry],
                  limits: &'a Limits,
                  options: TableBuildOptions,
              ) -> Self {
                  Self {
                      database_directory,
                      temporary_directory,
                      database_id,
                      file_number,
                      entries,
                      limits,
                      options,
                  }
              }
          }

          '''
          if "pub struct TableBuildRequest<'a>" not in text:
              if marker not in text:
                  raise SystemExit("TableBuildRequest insertion marker not found")
              text = text.replace(marker, request_type + marker, 1)

          old_signature = '''pub fn build_table<F: FileSystem>(
              filesystem: &F,
              database_directory: &Path,
              temporary_directory: &Path,
              database_id: DatabaseId,
              file_number: u64,
              entries: &[TableEntry],
              limits: &Limits,
              options: TableBuildOptions,
          ) -> Result<TableMeta> {'''
          new_signature = '''pub fn build_table<F: FileSystem>(
              filesystem: &F,
              request: TableBuildRequest<'_>,
          ) -> Result<TableMeta> {
              let TableBuildRequest {
                  database_directory,
                  temporary_directory,
                  database_id,
                  file_number,
                  entries,
                  limits,
                  options,
              } = request;'''
          if old_signature in text:
              text = text.replace(old_signature, new_signature, 1)
          elif new_signature not in text:
              raise SystemExit("build_table signature not found")
          sstable.write_text(text)

          def find_close(source: str, open_index: int) -> int:
              depth = 0
              quote = None
              escape = False
              for index in range(open_index, len(source)):
                  char = source[index]
                  if quote is not None:
                      if escape:
                          escape = False
                      elif char == "\\":
                          escape = True
                      elif char == quote:
                          quote = None
                      continue
                  if char in ('"', "'"):
                      quote = char
                      continue
                  if char == '(':
                      depth += 1
                  elif char == ')':
                      depth -= 1
                      if depth == 0:
                          return index
              raise SystemExit("unclosed build_table call")

          def split_top_level(arguments: str) -> list[str]:
              result = []
              start = 0
              round_depth = square_depth = brace_depth = 0
              quote = None
              escape = False
              for index, char in enumerate(arguments):
                  if quote is not None:
                      if escape:
                          escape = False
                      elif char == "\\":
                          escape = True
                      elif char == quote:
                          quote = None
                      continue
                  if char in ('"', "'"):
                      quote = char
                  elif char == '(':
                      round_depth += 1
                  elif char == ')':
                      round_depth -= 1
                  elif char == '[':
                      square_depth += 1
                  elif char == ']':
                      square_depth -= 1
                  elif char == '{':
                      brace_depth += 1
                  elif char == '}':
                      brace_depth -= 1
                  elif char == ',' and round_depth == square_depth == brace_depth == 0:
                      result.append(arguments[start:index].strip())
                      start = index + 1
              tail = arguments[start:].strip()
              if tail:
                  result.append(tail)
              return result

          modified_calls = 0
          modified_files = []
          for path in sorted(root.rglob("*.rs")):
              source = path.read_text()
              positions = []
              cursor = 0
              token = "build_table("
              while True:
                  found = source.find(token, cursor)
                  if found < 0:
                      break
                  line_start = source.rfind("\n", 0, found) + 1
                  prefix = source[line_start:found]
                  if not prefix.lstrip().startswith("//"):
                      positions.append(found)
                  cursor = found + len(token)

              changed = False
              for found in reversed(positions):
                  open_index = found + len("build_table")
                  close_index = find_close(source, open_index)
                  arguments = split_top_level(source[open_index + 1 : close_index])
                  if len(arguments) != 8:
                      raise SystemExit(
                          f"unexpected build_table arity {len(arguments)} in {path}:{source.count(chr(10), 0, found) + 1}"
                      )
                  line_start = source.rfind("\n", 0, found) + 1
                  line_prefix = source[line_start:found]
                  indent = line_prefix[: len(line_prefix) - len(line_prefix.lstrip(" \t"))]
                  constructor = (
                      "TableBuildRequest::new"
                      if path == sstable
                      else "forgedb_sstable::TableBuildRequest::new"
                  )
                  nested_indent = indent + "    "
                  argument_indent = nested_indent + "    "
                  replacement_lines = [
                      "build_table(",
                      f"{nested_indent}{arguments[0]},",
                      f"{nested_indent}{constructor}(",
                  ]
                  replacement_lines.extend(
                      f"{argument_indent}{argument}," for argument in arguments[1:]
                  )
                  replacement_lines.extend(
                      [
                          f"{nested_indent}),",
                          f"{indent})",
                      ]
                  )
                  replacement = "\n".join(replacement_lines)
                  source = source[:found] + replacement + source[close_index + 1 :]
                  modified_calls += 1
                  changed = True

              if changed:
                  path.write_text(source)
                  modified_files.append(str(path))

          if modified_calls < 4:
              raise SystemExit(f"expected at least 4 build_table calls, rewrote {modified_calls}")
          print(f"rewrote {modified_calls} build_table calls in {modified_files}")
          PY
      - run: cargo fmt --all
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - name: Commit strict SSTable refactor
        shell: bash
        run: |
          if git diff --quiet; then
            echo "SSTable builder already refactored"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "refactor(sstable): replace builder argument list with request"
          git push origin HEAD:${{ github.head_ref }}

  test:
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --doc
      - run: cargo build --locked --workspace --release

  msrv:
    name: ubuntu / Rust 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
