name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  canonicalize-v03-integration:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/v0.3.0-full-lsm-read-path'
    name: canonicalize v0.3 integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Adapt to released v0.2 APIs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old in text:
                  file.write_text(text.replace(old, new, 1))
              elif new not in text:
                  raise SystemExit(f"expected pattern not found in {path}")

          replace_once(
              "crates/forgedb/src/database_v3_fixed.rs",
              '''use forgedb_sstable::{
              TableBuildOptions, TableReader, build_table, sst_file_name,
          };''',
              '''use forgedb_sstable::{
              TableBuildOptions, TableBuildRequest, TableReader, build_table, sst_file_name,
          };''',
          )
          replace_once(
              "crates/forgedb/src/database_v3_fixed.rs",
              '''        let (manifest_writer, manifest, _) = if current_exists {
                      open_manifest(&filesystem, &directory, identity, &limits, options.read_only)?
                  } else if options.read_only {''',
              '''        let (manifest_writer, manifest, _) = if current_exists {
                      let opened =
                          open_manifest(&filesystem, &directory, identity, &limits, options.read_only)?;
                      (opened.writer, opened.state, opened.replay)
                  } else if options.read_only {''',
          )
          replace_once(
              "crates/forgedb/src/database_v3_fixed.rs",
              '''            let metadata = build_table(
                          filesystem,
                          &self.directory,
                          &self.directory.join(TEMP_DIRECTORY_NAME),
                          self.identity,
                          table_file_number,
                          &entries,
                          limits,
                          TableBuildOptions {
                              data_block_size: self.options.data_block_size,
                              restart_interval: self.options.restart_interval,
                              bloom_bits_per_key: self.options.bloom_bits_per_key,
                          },
                      )?;''',
              '''            let temporary_directory = self.directory.join(TEMP_DIRECTORY_NAME);
                      let metadata = build_table(
                          filesystem,
                          TableBuildRequest::new(
                              &self.directory,
                              &temporary_directory,
                              self.identity,
                              table_file_number,
                              &entries,
                              limits,
                              TableBuildOptions {
                                  data_block_size: self.options.data_block_size,
                                  restart_interval: self.options.restart_interval,
                                  bloom_bits_per_key: self.options.bloom_bits_per_key,
                              },
                          ),
                      )?;''',
          )
          replace_once(
              "crates/forgedb/src/recovery_plan.rs",
              '''        let (_, manifest, _) = open_manifest(
                      &filesystem,
                      &database_path,
                      identity,
                      &limits,
                      true,
                  )?;''',
              '''        let opened = open_manifest(&filesystem, &database_path, identity, &limits, true)?;
                  let manifest = opened.state;''',
          )
          replace_once(
              "crates/forgedb/src/sst_entry_cursor.rs",
              '''    use forgedb_sstable::{TableBuildOptions, build_table, sst_file_name};''',
              '''    use forgedb_sstable::{
                  TableBuildOptions, TableBuildRequest, build_table, sst_file_name,
              };''',
          )
          replace_once(
              "crates/forgedb/src/sst_entry_cursor.rs",
              '''        let metadata = build_table(
                      &NativeFileSystem,
                      &directory,
                      &directory.join("TEMP"),
                      identity,
                      7,
                      &entries,
                      &limits,
                      TableBuildOptions {
                          data_block_size: 1024,
                          restart_interval: 4,
                          bloom_bits_per_key: 10,
                      },
                  )?;''',
              '''        let temporary_directory = directory.join("TEMP");
                  let metadata = build_table(
                      &NativeFileSystem,
                      TableBuildRequest::new(
                          &directory,
                          &temporary_directory,
                          identity,
                          7,
                          &entries,
                          &limits,
                          TableBuildOptions {
                              data_block_size: 1024,
                              restart_interval: 4,
                              bloom_bits_per_key: 10,
                          },
                      ),
                  )?;''',
          )
          replace_once(
              "crates/forgedb/src/database_streaming_wrapper.rs",
              '''        assert_eq!(rows.first().map(|row| row.0.as_slice()), Some(b"key-0050"));
                  assert_eq!(rows.last().map(|row| row.0.as_slice()), Some(b"key-0309"));''',
              '''        assert_eq!(
                      rows.first().map(|row| row.0.as_slice()),
                      Some(b"key-0050".as_slice())
                  );
                  assert_eq!(
                      rows.last().map(|row| row.0.as_slice()),
                      Some(b"key-0309".as_slice())
                  );''',
          )
          PY
      - run: cargo fmt --all
      - name: Commit canonical integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "v0.3 integration already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "fix(v0.3): integrate final v0.2 APIs and rustfmt"
          git push origin HEAD:${{ github.head_ref }}

  test:
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --doc
      - run: cargo build --locked --workspace --release

  msrv:
    name: ubuntu / Rust 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
