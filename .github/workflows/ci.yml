name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --doc
      - run: cargo build --locked --workspace --release

  msrv:
    name: ubuntu / Rust 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features

  integrate_obsolete_lifetime:
    name: integrate reference-aware obsolete lifetime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v0.4.0-leveled-compaction
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply lifetime integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          database = Path("crates/forgedb/src/database_v3_fixed.rs")
          text = database.read_text()
          text = replace_once(
              text,
              "    fatal_write_error: Option<String>,\n    lock: Option<NativeLockGuard>,",
              "    fatal_write_error: Option<String>,\n    obsolete_versions: Vec<ObsoleteVersion>,\n    lock: Option<NativeLockGuard>,",
              "DatabaseState obsolete queue",
          )
          text = replace_once(
              text,
              "                fatal_write_error: None,\n                lock: Some(lock),",
              "                fatal_write_error: None,\n                obsolete_versions: Vec::new(),\n                lock: Some(lock),",
              "DatabaseState obsolete init",
          )
          text = replace_once(
              text,
              '''        let (manifest, version) = {
                      let state = self.lock_state()?;
                      (state.manifest.clone(), Arc::clone(&state.version))
                  };''',
              '''        let (manifest, version) = {
                      let mut state = self.lock_state()?;
                      self.collect_obsolete_ssts_locked(&mut state)?;
                      (state.manifest.clone(), Arc::clone(&state.version))
                  };''',
              "file inventory cleanup",
          )
          text = replace_once(
              text,
              '''        if let Some(writer) = state.manifest_writer.take() {
                      writer.sync()?;
                  }
                  state.lock.take();''',
              '''        if let Some(writer) = state.manifest_writer.take() {
                      writer.sync()?;
                  }
                  self.collect_obsolete_ssts_locked(&mut state)?;
                  state.lock.take();''',
              "close cleanup",
          )
          database.write_text(text)

          cursor = Path("crates/forgedb/src/sst_entry_cursor.rs")
          text = cursor.read_text()
          text = replace_once(
              text,
              "use std::path::{Path, PathBuf};\n",
              "use std::path::{Path, PathBuf};\nuse std::sync::Arc;\n",
              "cursor Arc import",
          )
          text = replace_once(
              text,
              "use crate::entry_cursor::EntryCursor;\n",
              "use crate::entry_cursor::EntryCursor;\nuse crate::version_set::VersionSet;\n",
              "cursor VersionSet import",
          )
          text = replace_once(
              text,
              "    finished: bool,\n    #[cfg(test)]",
              "    finished: bool,\n    _version_lease: Option<Arc<VersionSet>>,\n    #[cfg(test)]",
              "cursor lease field",
          )
          text = replace_once(
              text,
              "            finished: false,\n            #[cfg(test)]",
              "            finished: false,\n            _version_lease: None,\n            #[cfg(test)]",
              "cursor lease init",
          )
          marker = "    fn load_next_block(&mut self) -> Result<()> {"
          lease_method = '''    pub(crate) fn with_version_lease(mut self, lease: Arc<VersionSet>) -> Self {
                  self._version_lease = Some(lease);
                  self
              }
          
          '''
          text = replace_once(text, marker, lease_method + marker, "cursor lease method")
          cursor.write_text(text)

          wrapper = Path("crates/forgedb/src/database_streaming_wrapper.rs")
          text = wrapper.read_text()
          text = replace_once(
              text,
              '''                read_options.verify_checksums,
                      )?;''',
              '''                read_options.verify_checksums,
                      )?
                      .with_version_lease(Arc::clone(&version));''',
              "streaming cursor Version lease",
          )
          wrapper.write_text(text)

          compaction = Path("crates/forgedb/src/database_compaction.rs")
          text = compaction.read_text()
          text = replace_once(
              text,
              '''        let next_version = state.version.with_compaction(
                      crate::version_set::CompactionVersionRequest {''',
              '''        let previous_version = Arc::clone(&state.version);
                  let next_version = previous_version.with_compaction(
                      crate::version_set::CompactionVersionRequest {''',
              "compaction previous Version lease",
          )
          text = replace_once(
              text,
              "        let installation = VersionEditV2 {\n",
              '''        let obsolete_files = plan
                      .source_files
                      .iter()
                      .chain(plan.output_level_files.iter())
                      .copied()
                      .collect::<Vec<_>>();
                  let installation = VersionEditV2 {
          ''',
              "compaction obsolete inputs",
          )
          text = replace_once(
              text,
              '''        append_manifest_edit(&mut state, &installation, &limits)?;
                  state.version = Arc::new(next_version);
                  Ok(())''',
              '''        append_manifest_edit(&mut state, &installation, &limits)?;
                  let obsolete = ObsoleteVersion::new(&previous_version, obsolete_files)?;
                  state.version = Arc::new(next_version);
                  state.obsolete_versions.push(obsolete);
                  drop(previous_version);
                  self.collect_obsolete_ssts_locked(&mut state)?;
                  Ok(())''',
              "compaction queue and cleanup",
          )
          text = replace_once(
              text,
              "        assert_eq!(inventory.orphan_sst.len(), 2);",
              "        assert!(inventory.orphan_sst.is_empty());",
              "compaction immediate cleanup assertion",
          )
          new_test = r'''
              #[test]
              fn active_streaming_scan_defers_input_deletion_until_iterator_drop() -> Result<()> {
                  let directory = temporary_directory("active-scan-lifetime")?;
                  let database = StreamingDatabase::open(&directory, compaction_options())?;
                  database.put(b"alpha", b"old", WriteOptions::sync())?;
                  database.flush()?;
                  database.put(b"alpha", b"new", WriteOptions::sync())?;
                  database.put(b"beta", b"value", WriteOptions::sync())?;
                  database.flush()?;
          
                  let iterator = database.scan(.., ReadOptions::default())?;
                  database.compact_range(None, None)?;
                  assert_eq!(database.file_inventory()?.orphan_sst.len(), 2);
          
                  drop(iterator);
                  assert!(database.file_inventory()?.orphan_sst.is_empty());
                  database.close()?;
                  fs::remove_dir_all(&directory).map_err(|source| {
                      Error::io("remove_test_directory", Some(directory), source)
                  })?;
                  Ok(())
              }
          '''
          position = text.rfind("\n}\n")
          if position < 0:
              raise SystemExit("database compaction test module end not found")
          text = text[:position] + new_test + text[position:]
          compaction.write_text(text)
          PY
      - run: cargo fmt --all
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --doc
      - run: cargo build --locked --workspace --release
      - name: Commit lifetime integration
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/forgedb/src
          git commit -m "feat(v0.4): defer obsolete SST deletion until readers release versions"
          git push origin HEAD:feature/v0.4.0-leveled-compaction
