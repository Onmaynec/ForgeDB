name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  refactor-v03-clippy:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/v0.3.0-full-lsm-read-path'
    name: refactor v0.3 strict Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply strict refactors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old in text:
                  file.write_text(text.replace(old, new, 1))
              elif new not in text:
                  raise SystemExit(f"expected pattern not found in {path}")

          replace_once(
              "crates/forgedb/src/database_streaming_wrapper.rs",
              '''        let mut options = Options::default();
                  options.data_block_size = 1024;''',
              '''        let options = Options {
                      data_block_size: 1024,
                      ..Options::default()
                  };''',
          )
          replace_once(
              "crates/forgedb/src/inventory.rs",
              '''        if let Some(previous) = previous_wal {
                      if !seen.contains(&previous) {
                          inventory
                              .blockers
                              .push(format!("previous WAL отсутствует: {previous}"));
                      }
                  }''',
              '''        if let Some(previous) = previous_wal
                      && !seen.contains(&previous)
                  {
                      inventory
                          .blockers
                          .push(format!("previous WAL отсутствует: {previous}"));
                  }''',
          )
          replace_once(
              "crates/forgedb/src/sst_entry_cursor.rs",
              '''        while self.next_block < self.data_handles.len() {''',
              '''        if self.next_block < self.data_handles.len() {''',
          )

          table_scan = Path("crates/forgedb/src/table_scan.rs")
          text = table_scan.read_text()
          marker = '''#[derive(Clone, Copy, Debug, Eq, PartialEq)]
          struct BlockHandle {
              offset: u64,
              length: u64,
          }

          '''
          request = '''#[derive(Clone, Copy, Debug, Eq, PartialEq)]
          struct BlockHandle {
              offset: u64,
              length: u64,
          }

          pub(crate) struct TableLookupRequest<'a> {
              pub(crate) path: &'a Path,
              pub(crate) expected_database_id: DatabaseId,
              pub(crate) metadata: &'a TableMeta,
              pub(crate) user_key: &'a [u8],
              pub(crate) snapshot: Option<SequenceNumber>,
              pub(crate) limits: &'a Limits,
              pub(crate) max_file_size: u64,
              pub(crate) verify_checksums: bool,
          }

          '''
          if "pub(crate) struct TableLookupRequest<'a>" not in text:
              if marker not in text:
                  raise SystemExit("TableLookupRequest insertion marker not found")
              text = text.replace(marker, request, 1)

          old_signature = '''pub(crate) fn lookup_at(
              path: &Path,
              expected_database_id: DatabaseId,
              metadata: &TableMeta,
              user_key: &[u8],
              snapshot: Option<SequenceNumber>,
              limits: &Limits,
              max_file_size: u64,
              verify_checksums: bool,
          ) -> Result<TableSnapshotLookup> {'''
          new_signature = '''pub(crate) fn lookup_at(request: TableLookupRequest<'_>) -> Result<TableSnapshotLookup> {
              let TableLookupRequest {
                  path,
                  expected_database_id,
                  metadata,
                  user_key,
                  snapshot,
                  limits,
                  max_file_size,
                  verify_checksums,
              } = request;'''
          if old_signature in text:
              text = text.replace(old_signature, new_signature, 1)
          elif new_signature not in text:
              raise SystemExit("lookup_at signature not found")
          table_scan.write_text(text)

          version_set = Path("crates/forgedb/src/version_set.rs")
          text = version_set.read_text()
          old_import = '''use crate::table_scan::{self, TableSnapshotLookup};'''
          new_import = '''use crate::table_scan::{self, TableLookupRequest, TableSnapshotLookup};'''
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit("VersionSet table_scan import not found")

          old_call = '''            let lookup = table_scan::lookup_at(
                          table.path(),
                          self.identity,
                          &table.metadata,
                          user_key,
                          snapshot,
                          limits,
                          self.max_file_size,
                          verify_checksums,
                      )?;'''
          new_call = '''            let lookup = table_scan::lookup_at(TableLookupRequest {
                          path: table.path(),
                          expected_database_id: self.identity,
                          metadata: &table.metadata,
                          user_key,
                          snapshot,
                          limits,
                          max_file_size: self.max_file_size,
                          verify_checksums,
                      })?;'''
          count = text.count(old_call)
          if count:
              if count != 2:
                  raise SystemExit(f"expected two lookup_at call sites, found {count}")
              text = text.replace(old_call, new_call)
          elif text.count(new_call) != 2:
              raise SystemExit("VersionSet lookup_at call sites not found")
          version_set.write_text(text)
          PY
      - run: cargo fmt --all
      - name: Commit strict refactors
        shell: bash
        run: |
          if git diff --quiet; then
            echo "v0.3 Clippy refactors already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "refactor(v0.3): satisfy strict read-path lints"
          git push origin HEAD:${{ github.head_ref }}

  test:
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --doc
      - run: cargo build --locked --workspace --release

  msrv:
    name: ubuntu / Rust 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
