name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --doc
      - run: cargo build --locked --workspace --release

  msrv:
    name: ubuntu / Rust 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features

  integrate_database_v2:
    name: integrate Database with MANIFEST V2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v0.4.0-leveled-compaction
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply level-aware runtime integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          database = Path("crates/forgedb/src/database_v3_fixed.rs")
          text = database.read_text()
          text = replace_once(
              text,
              '''use forgedb_manifest::{
              CURRENT_FILE_NAME, ManifestState, ManifestWriter, VersionEdit, create_manifest, open_manifest,
          };''',
              '''use forgedb_manifest::{
              CURRENT_FILE_NAME, LevelFile, ManifestStateV2, ManifestV2Writer, VersionEditV2,
          };''',
              "database manifest imports",
          )
          text = replace_once(
              text,
              'use crate::inventory::FileInventory;\n',
              'use crate::inventory::FileInventory;\nuse crate::manifest_runtime::{RuntimeManifestRequest, open_runtime_manifest};\n',
              "database runtime import",
          )
          text = replace_once(
              text,
              '''        let current_exists = directory.join(CURRENT_FILE_NAME).exists();
                  let (manifest_writer, manifest, _) = if current_exists {
                      let opened =
                          open_manifest(&filesystem, &directory, identity, &limits, options.read_only)?;
                      (opened.writer, opened.state, opened.replay)
                  } else if options.read_only {
                      return Err(Error::UnsupportedFormat {
                          component: "CURRENT/MANIFEST",
                          found: 0,
                          minimum_supported: 1,
                          maximum_supported: 1,
                      });
                  } else {
                      let (writer, state) = create_manifest(&filesystem, &directory, identity, 1, &limits)?;
                      (Some(writer), state, Default::default())
                  };
          ''',
              '''        let current_exists = directory.join(CURRENT_FILE_NAME).exists();
                  let runtime_manifest = open_runtime_manifest(RuntimeManifestRequest {
                      filesystem: &filesystem,
                      directory: &directory,
                      database_id: identity,
                      limits: &limits,
                      read_only: options.read_only,
                      current_exists,
                      level_count: options.level_count,
                  })?;
                  let manifest_writer = runtime_manifest.writer;
                  let manifest = runtime_manifest.state;
          ''',
              "database runtime open",
          )
          text = replace_once(
              text,
              '''        let version = Arc::new(VersionSet::open(
                      &directory,
                      identity,
                      &manifest,
                      &limits,
                      options.level_count,
                      options.max_compaction_bytes,
                  )?);''',
              '''        let version = Arc::new(VersionSet::open_v2(
                      &directory,
                      identity,
                      &manifest,
                      &limits,
                      options.max_compaction_bytes,
                  )?);''',
              "database VersionSet open",
          )
          text = re.sub(r'\bManifestWriter\b', 'ManifestV2Writer', text)
          text = re.sub(r'\bManifestState\b', 'ManifestStateV2', text)
          text = re.sub(r'\bVersionEdit\b', 'VersionEditV2', text)
          text = replace_once(
              text,
              'added_files: vec![metadata],',
              'added_files: vec![LevelFile { level: 0, metadata }],',
              "level-aware L0 add",
          )
          text = text.replace('FileInventory::build(', 'FileInventory::build_v2(')
          for forbidden in [r'\bManifestWriter\b', r'\bManifestState\b', r'\bVersionEdit\b', r'VersionSet::open\(', r'FileInventory::build\(']:
              if re.search(forbidden, text):
                  raise SystemExit(f"database legacy pattern remains: {forbidden}")
          database.write_text(text)

          recovery = Path("crates/forgedb/src/recovery_plan.rs")
          text = recovery.read_text()
          text = replace_once(
              text,
              'use forgedb_manifest::{manifest_file_name, open_manifest};',
              'use forgedb_manifest::{CURRENT_FILE_NAME, manifest_file_name};',
              "recovery imports",
          )
          text = replace_once(
              text,
              'use crate::inventory::FileInventory;\n',
              'use crate::inventory::FileInventory;\nuse crate::manifest_runtime::{RuntimeManifestRequest, open_runtime_manifest};\n',
              "recovery runtime import",
          )
          text = replace_once(
              text,
              '''        let opened = open_manifest(&filesystem, &database_path, identity, &limits, true)?;
                  let manifest = opened.state;
                  let version = VersionSet::open(
                      &database_path,
                      identity,
                      &manifest,
                      &limits,
                      options.level_count,
                      options.max_compaction_bytes,
                  )?;''',
              '''        let runtime = open_runtime_manifest(RuntimeManifestRequest {
                      filesystem: &filesystem,
                      directory: &database_path,
                      database_id: identity,
                      limits: &limits,
                      read_only: true,
                      current_exists: database_path.join(CURRENT_FILE_NAME).exists(),
                      level_count: options.level_count,
                  })?;
                  let manifest = runtime.state;
                  let version = VersionSet::open_v2(
                      &database_path,
                      identity,
                      &manifest,
                      &limits,
                      options.max_compaction_bytes,
                  )?;''',
              "recovery V2 open",
          )
          text = text.replace('FileInventory::build(', 'FileInventory::build_v2(')
          if 'open_manifest(' in text or 'VersionSet::open(' in text or 'FileInventory::build(' in text:
              raise SystemExit("recovery plan still contains V1 open path")
          recovery.write_text(text)

          inventory = Path("crates/forgedb/src/inventory.rs")
          text = inventory.read_text()
          text = replace_once(
              text,
              '''use forgedb_manifest::{
              CURRENT_FILE_NAME, ManifestState, ManifestStateV2, manifest_file_name,
              parse_manifest_file_name,
          };''',
              '''use forgedb_manifest::{
              CURRENT_FILE_NAME, ManifestStateV2, manifest_file_name, parse_manifest_file_name,
          };''',
              "inventory imports",
          )
          legacy_build = '''    pub(crate) fn build(
                  directory: &Path,
                  manifest: &ManifestState,
                  live_sst_numbers: impl IntoIterator<Item = u64>,
              ) -> Result<Self> {
                  Self::build_parts(
                      directory,
                      manifest.manifest_number,
                      manifest.log_number,
                      manifest.previous_log_number,
                      live_sst_numbers,
                  )
              }
          
          '''
          text = replace_once(text, legacy_build, '', "inventory V1 builder")
          inventory.write_text(text)

          version_set = Path("crates/forgedb/src/version_set.rs")
          text = version_set.read_text()
          text = replace_once(
              text,
              'use forgedb_manifest::{ManifestState, ManifestStateV2};',
              'use forgedb_manifest::ManifestStateV2;',
              "VersionSet imports",
          )
          pattern = re.compile(r'    pub\(crate\) fn open\(.*?\n    pub\(crate\) fn open_v2\(', re.S)
          match = pattern.search(text)
          if match is None:
              raise SystemExit("VersionSet V1 bridge not found")
          text = text[:match.start()] + '    pub(crate) fn open_v2(' + text[match.end():]
          if 'pub(crate) fn open(' in text:
              raise SystemExit("VersionSet V1 open remains")
          version_set.write_text(text)

          runtime = Path("crates/forgedb/src/manifest_runtime.rs")
          text = runtime.read_text()
          text = text.replace('    pub(crate) migrated_from_v1: bool,\n', '')
          text = text.replace('            migrated_from_v1: false,\n', '')
          text = text.replace('            migrated_from_v1: true,\n', '')
          text = text.replace('        migrated_from_v1: true,\n', '')
          text = re.sub(r'^\s*assert!\(!?\w+\.migrated_from_v1\);\n', '', text, flags=re.M)
          if 'migrated_from_v1' in text:
              raise SystemExit("runtime migration marker remains")
          runtime.write_text(text)
          PY
      - run: cargo fmt --all
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --doc
      - run: cargo build --locked --workspace --release
      - name: Commit integrated runtime
        run: |
          if git diff --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/forgedb/src
          git commit -m "feat(v0.4): migrate database runtime to MANIFEST V2"
          git push origin HEAD:feature/v0.4.0-leveled-compaction
