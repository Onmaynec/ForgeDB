name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  fix-v04-output-lookahead:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/v0.4.0-leveled-compaction'
    name: fix compaction output lookahead
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Avoid double validation of lookahead
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/forgedb-lsm/src/output.rs")
          lines = path.read_text().splitlines()
          if not any("return Ok(Some(entry));" in line for line in lines):
              function = next(
                  index
                  for index, line in enumerate(lines)
                  if "fn pull_entry(&mut self)" in line
              )
              ordering = next(
                  index
                  for index, line in enumerate(lines[function + 1 :], function + 1)
                  if line.strip() == "if self"
              )
              indent = lines[function][: len(lines[function]) - len(lines[function].lstrip())]
              body = f"{indent}    "
              replacement = [
                  f"{body}if let Some(entry) = self.lookahead.take() {{",
                  f"{body}    return Ok(Some(entry));",
                  f"{body}}}",
                  f"{body}let Some(entry) = self.source.next().transpose()? else {{",
                  f"{body}    return Ok(None);",
                  f"{body}}};",
              ]
              lines[function + 1 : ordering] = replacement
          path.write_text("\n".join(lines) + "\n")
          PY
      - run: cargo fmt --all
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - name: Commit output lookahead fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "output lookahead already fixed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/forgedb-lsm/src
          git commit -m "fix(v0.4): avoid double-validating output lookahead"
          git push origin HEAD:${{ github.head_ref }}

  test:
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --doc
      - run: cargo build --locked --workspace --release

  msrv:
    name: ubuntu / Rust 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
