name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate_manual_picker:
    name: integrate deterministic manual picker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v0.4.0-leveled-compaction
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Connect manual picker
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          planner = Path("crates/forgedb-lsm/src/lib.rs")
          text = planner.read_text()
          text = replace_once(
              text,
              '''pub enum CompactionReason {
                  L0FileCount,
                  LevelBytes,
              }''',
              '''pub enum CompactionReason {
                  L0FileCount,
                  LevelBytes,
                  ManualRange,
              }''',
              "manual reason",
          )
          text = replace_once(text, "fn validate_layout(", "pub(super) fn validate_layout(", "layout visibility")
          text = replace_once(text, "fn ranges_overlap(\n", "pub(super) fn ranges_overlap(\n", "range visibility")
          text = replace_once(text, "fn extend_range(", "pub(super) fn extend_range(", "extend visibility")
          planner.write_text(text)

          root = Path("crates/forgedb-lsm/src/root.rs")
          text = root.read_text()
          text = replace_once(text, "mod merge;\n", "mod manual;\nmod merge;\n", "manual module")
          text = replace_once(
              text,
              "pub use merge::{\n",
              "pub use manual::pick_manual_compaction;\npub use merge::{\n",
              "manual export",
          )
          root.write_text(text)

          manual = Path("crates/forgedb-lsm/src/manual.rs")
          text = manual.read_text()
          text = replace_once(
              text,
              '''    build_manual_plan(
                  0,
                  1,
                  level_zero,
                  level_one,
                  &selected_l0,
                  &selected_l1,
                  smallest,
                  largest,
                  score,
              )''',
              '''    build_manual_plan(BuildManualPlanRequest {
                  source_level: 0,
                  output_level: 1,
                  source: level_zero,
                  target: level_one,
                  selected_source: &selected_l0,
                  selected_target: &selected_l1,
                  smallest_user_key: smallest,
                  largest_user_key: largest,
                  score,
              })''',
              "manual L0 request",
          )
          text = replace_once(
              text,
              '''    build_manual_plan(
                  score.level,
                  output_level,
                  source,
                  target,
                  &selected_source,
                  &selected_target,
                  smallest,
                  largest,
                  score,
              )''',
              '''    build_manual_plan(BuildManualPlanRequest {
                  source_level: score.level,
                  output_level,
                  source,
                  target,
                  selected_source: &selected_source,
                  selected_target: &selected_target,
                  smallest_user_key: smallest,
                  largest_user_key: largest,
                  score,
              })''',
              "manual level request",
          )
          text = replace_once(
              text,
              '''#[allow(clippy::too_many_arguments)]
              fn build_manual_plan(
                  source_level: usize,
                  output_level: usize,
                  source: &[TableMeta],
                  target: &[TableMeta],
                  selected_source: &BTreeSet<u64>,
                  selected_target: &BTreeSet<u64>,
                  smallest_user_key: Vec<u8>,
                  largest_user_key: Vec<u8>,
                  score: CompactionScore,
              ) -> Result<CompactionPlan> {
                  let source_files = source''',
              '''struct BuildManualPlanRequest<'a> {
                  source_level: usize,
                  output_level: usize,
                  source: &'a [TableMeta],
                  target: &'a [TableMeta],
                  selected_source: &'a BTreeSet<u64>,
                  selected_target: &'a BTreeSet<u64>,
                  smallest_user_key: Vec<u8>,
                  largest_user_key: Vec<u8>,
                  score: CompactionScore,
              }
              
              fn build_manual_plan(request: BuildManualPlanRequest<'_>) -> Result<CompactionPlan> {
                  let BuildManualPlanRequest {
                      source_level,
                      output_level,
                      source,
                      target,
                      selected_source,
                      selected_target,
                      smallest_user_key,
                      largest_user_key,
                      score,
                  } = request;
                  let source_files = source''',
              "typed manual build request",
          )
          if "allow(clippy::too_many_arguments)" in text:
              raise SystemExit("manual picker still contains lint allowance")
          manual.write_text(text)

          database = Path("crates/forgedb/src/database_compaction.rs")
          text = database.read_text()
          text = replace_once(
              text,
              '''        let decision = forgedb_lsm::pick_compaction(
                      &levels,
                      forgedb_lsm::CompactionConfig {
                          l0_compaction_trigger: self.options.l0_compaction_trigger,
                          level1_target_size: self.options.level1_target_size,
                          level_size_multiplier: self.options.level_size_multiplier,
                          max_compaction_bytes: self.options.max_compaction_bytes,
                      },
                  )?;''',
              '''        let decision = forgedb_lsm::pick_manual_compaction(
                      &levels,
                      forgedb_lsm::CompactionConfig {
                          l0_compaction_trigger: self.options.l0_compaction_trigger,
                          level1_target_size: self.options.level1_target_size,
                          level_size_multiplier: self.options.level_size_multiplier,
                          max_compaction_bytes: self.options.max_compaction_bytes,
                      },
                      start,
                      end,
                  )?;''',
              "database manual picker",
          )
          text = replace_once(
              text,
              '''        if !plan_overlaps_requested_range(&plan, start, end) {
                      return Ok(());
                  }
          
          ''',
              "",
              "obsolete range filter",
          )
          start_marker = "fn plan_overlaps_requested_range("
          end_marker = "fn selected_compaction_inputs("
          start_index = text.find(start_marker)
          end_index = text.find(end_marker)
          if start_index < 0 or end_index <= start_index:
              raise SystemExit("obsolete range helper boundaries not found")
          text = text[:start_index] + text[end_index:]

          test = '''
              #[test]
              fn manual_range_compacts_requested_l0_file_below_pressure_trigger() -> Result<()> {
                  let directory = temporary_directory("manual-range")?;
                  let options = Options {
                      l0_compaction_trigger: 10,
                      l0_slowdown_trigger: 11,
                      l0_stop_trigger: 12,
                      target_sst_size: 1024,
                      data_block_size: 1024,
                      ..Options::default()
                  };
                  let database = StreamingDatabase::open(&directory, options)?;
                  database.put(b"alpha", b"one", WriteOptions::sync())?;
                  database.flush()?;
                  database.put(b"middle", b"two", WriteOptions::sync())?;
                  database.flush()?;
          
                  database.compact_range(Some(b"m"), Some(b"z"))?;
                  assert_eq!(database.get(b"alpha")?, Some(b"one".to_vec()));
                  assert_eq!(database.get(b"middle")?, Some(b"two".to_vec()));
                  {
                      let state = database.inner.lock_state()?;
                      let levels = state.version.metadata_levels();
                      assert_eq!(levels[0].len(), 1);
                      assert_eq!(levels[0][0].smallest_user_key, b"alpha");
                      assert_eq!(levels[1].len(), 1);
                      assert_eq!(levels[1][0].smallest_user_key, b"middle");
                  }
                  database.close()?;
                  fs::remove_dir_all(&directory).map_err(|source| {
                      Error::io("remove_test_directory", Some(directory), source)
                  })?;
                  Ok(())
              }
          '''
          module_end = text.rfind("\n}")
          if module_end < 0:
              raise SystemExit("database compaction test module end not found")
          text = text[:module_end] + test + text[module_end:]
          database.write_text(text)
          PY
      - run: cargo fmt --all
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --doc
      - run: cargo build --locked --workspace --release
      - name: Commit manual picker
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/forgedb-lsm/src crates/forgedb/src/database_compaction.rs
          git commit -m "feat(v0.4): select manual compaction by requested range"
          git push origin HEAD:feature/v0.4.0-leveled-compaction
