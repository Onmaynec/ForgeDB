name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  canonicalize-manifest-dispatch:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/v0.4.0-leveled-compaction'
    name: canonicalize MANIFEST dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply strict dispatch fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/forgedb-manifest/src/dispatch.rs")
          text = path.read_text()
          text = text.replace(
              "use crate::log::{ManifestWriter, OpenManifest, open_manifest};",
              "use crate::log::{OpenManifest, open_manifest};",
          )
          text = text.replace(
              "use crate::v2_log::{ManifestV2Writer, OpenManifestV2, open_manifest_v2};",
              "use crate::v2_log::{OpenManifestV2, open_manifest_v2};",
          )
          text = text.replace(
              "    use forgedb_fs::{FileSystem, NativeFileSystem};",
              "    use forgedb_fs::NativeFileSystem;",
          )
          text = text.replace(
              '''        Err(Error::UnsupportedFormat {
                  component,
                  found: 1,
                  ..
              }) if component == "MANIFEST V2" => open_manifest(''',
              '''        Err(Error::UnsupportedFormat {
                  component: "MANIFEST V2",
                  found: 1,
                  ..
              }) => open_manifest(''',
          )
          path.write_text(text)
          PY
      - run: cargo fmt --all
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - name: Commit canonical dispatch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "MANIFEST dispatch already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/forgedb-manifest/src/dispatch.rs
          git commit -m "refactor(v0.4): satisfy strict MANIFEST dispatch lints"
          git push origin HEAD:${{ github.head_ref }}

  test:
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --doc
      - run: cargo build --locked --workspace --release

  msrv:
    name: ubuntu / Rust 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
