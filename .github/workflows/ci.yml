name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fix-v040:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/v0.4.0-release-gate' && github.event.action == 'reopened'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Нормализовать Rust-код
        run: cargo fmt --all
      - name: Проверить форматирование
        run: cargo fmt --all --check
      - name: Выполнить strict Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Выполнить workspace tests
        run: cargo test --locked --workspace --all-features
      - name: Выполнить doctests
        run: cargo test --locked --workspace --doc
      - name: Собрать release profile
        run: cargo build --locked --workspace --release
      - name: Опубликовать rustfmt-нормализацию
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: применить rustfmt к v0.4.0"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  test:
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --doc
      - run: cargo build --locked --workspace --release

  msrv:
    name: ubuntu / Rust 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
