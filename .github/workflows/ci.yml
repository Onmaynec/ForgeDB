name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  finalize-v04-merge:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/v0.4.0-leveled-compaction'
    name: finalize bounded compaction merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Complete tombstone metrics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/forgedb-lsm/src/merge.rs")
          lines = path.read_text().splitlines()

          if not any("let input_tombstones = versions" in line for line in lines):
              start = next(
                  index
                  for index, line in enumerate(lines)
                  if "self.observe_input_group(&versions)?;" in line
              )
              end = next(
                  index
                  for index, line in enumerate(lines[start:], start)
                  if "self.pending.extend(retained);" in line
              )
              indent = lines[start][: len(lines[start]) - len(lines[start].lstrip())]
              replacement = [
                  f"{indent}self.observe_input_group(&versions)?;",
                  f"{indent}let input_tombstones = versions",
                  f"{indent}    .iter()",
                  f"{indent}    .filter(|entry| entry.internal_key.value_type() == ValueType::Deletion)",
                  f"{indent}    .count();",
                  f"{indent}let retained = retain_versions(versions, self.options);",
                  f"{indent}let output_tombstones = retained",
                  f"{indent}    .iter()",
                  f"{indent}    .filter(|entry| entry.internal_key.value_type() == ValueType::Deletion)",
                  f"{indent}    .count();",
                  f"{indent}let dropped_tombstones = input_tombstones",
                  f"{indent}    .checked_sub(output_tombstones)",
                  f"{indent}    .ok_or(Error::InternalInvariant {{",
                  f"{indent}        invariant: \"I-COMPACTION-DROPPED-TOMBSTONES\",",
                  f"{indent}        reason: \"output tombstones превышают input tombstones\".to_owned(),",
                  f"{indent}    }})?;",
                  f"{indent}self.observe_output_group(&retained, dropped_tombstones)?;",
                  f"{indent}self.pending.extend(retained);",
              ]
              lines[start : end + 1] = replacement

          if not any("dropped_tombstones: usize" in line for line in lines):
              index = next(
                  index
                  for index, line in enumerate(lines)
                  if "fn observe_output_group(&mut self, retained: &[TableEntry])" in line
              )
              indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
              lines[index : index + 1] = [
                  f"{indent}fn observe_output_group(",
                  f"{indent}    &mut self,",
                  f"{indent}    retained: &[TableEntry],",
                  f"{indent}    dropped_tombstones: usize,",
                  f"{indent}) -> Result<()> {{",
              ]

          if not any("compaction_dropped_tombstones" in line for line in lines):
              index = next(
                  index
                  for index, line in enumerate(lines)
                  if "self.stats.dropped_versions = dropped;" in line
              )
              indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
              insertion = [
                  f"{indent}self.stats.dropped_tombstones = checked_add(",
                  f"{indent}    self.stats.dropped_tombstones,",
                  f"{indent}    u64::try_from(dropped_tombstones).map_err(|_| Error::ResourceLimit {{",
                  f"{indent}        resource: \"compaction_dropped_tombstones\",",
                  f"{indent}        limit: u64::MAX,",
                  f"{indent}        observed: u64::MAX,",
                  f"{indent}    }})?,",
                  f"{indent}    \"compaction_dropped_tombstones\",",
                  f"{indent})?;",
              ]
              lines[index + 1 : index + 1] = insertion

          path.write_text("\n".join(lines) + "\n")
          PY
      - run: cargo fmt --all
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - name: Commit canonical merge
        shell: bash
        run: |
          if git diff --quiet; then
            echo "bounded merge already finalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/forgedb-lsm
          git commit -m "feat(v0.4): finalize bounded merge metrics"
          git push origin HEAD:${{ github.head_ref }}

  test:
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --doc
      - run: cargo build --locked --workspace --release

  msrv:
    name: ubuntu / Rust 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
