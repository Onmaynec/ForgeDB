name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  finalize-manifest-v2-io:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/v0.4.0-leveled-compaction'
    name: finalize MANIFEST V2 I/O
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fix migration contract and no-clobber policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/forgedb-manifest/src/v2_log.rs")
          text = path.read_text()
          text = text.replace("added_l0_files:", "added_files:")

          guard = '''    let final_path = directory.join(&name);
              ensure_path_absent(filesystem, &final_path, "MANIFEST V2 destination")?;'''
          if "ensure_path_absent(filesystem, &final_path" not in text:
              marker = "    let final_path = directory.join(&name);"
              if text.count(marker) != 1:
                  raise SystemExit("unique final MANIFEST path marker not found")
              text = text.replace(marker, guard, 1)

          if "fn ensure_path_absent<F: FileSystem>" not in text:
              marker = "fn write_current_v2<F: FileSystem>"
              index = text.find(marker)
              if index < 0:
                  raise SystemExit("write_current_v2 marker not found")
              helper = '''fn ensure_path_absent<F: FileSystem>(
              filesystem: &F,
              path: &Path,
              component: &'static str,
          ) -> Result<()> {
              match filesystem.file_size(path) {
                  Ok(size) => Err(Error::corruption(
                      component,
                      format!(
                          "destination уже существует: {} ({size} bytes)",
                          path.display()
                      ),
                  )),
                  Err(Error::Io { source, .. }) if source.kind() == ErrorKind::NotFound => Ok(()),
                  Err(error) => Err(error),
              }
          }

          '''
              text = text[:index] + helper + text[index:]

          test_name = "fn migration_refuses_to_overwrite_existing_final_manifest()"
          if test_name not in text:
              insertion = '''

              #[test]
              fn migration_refuses_to_overwrite_existing_final_manifest() -> Result<()> {
                  let directory = temporary_directory("existing-final")?;
                  let filesystem = NativeFileSystem;
                  let limits = Limits::default();
                  let database_id = DatabaseId::random();
                  let v1 = v1_state(database_id, &limits)?;
                  let final_path = directory.join("MANIFEST-000011");
                  let temporary = directory.join("MANIFEST-000011.tmp");
                  fs::write(&final_path, b"suspicious-final").map_err(|source| {
                      Error::io(
                          "write_existing_final_manifest_test",
                          Some(final_path.clone()),
                          source,
                      )
                  })?;
                  assert!(migrate_manifest_v1_to_v2(
                      &filesystem,
                      &directory,
                      &v1,
                      11,
                      4,
                      &limits,
                  )
                  .is_err());
                  assert_eq!(
                      fs::read(&final_path).map_err(|source| Error::io(
                          "read_existing_final_manifest_test",
                          Some(final_path.clone()),
                          source,
                      ))?,
                      b"suspicious-final"
                  );
                  assert!(!temporary.exists());
                  fs::remove_dir_all(&directory).map_err(|source| {
                      Error::io("remove_test_directory", Some(directory), source)
                  })?;
                  Ok(())
              }
          '''
              end = text.rfind("\n}")
              if end < 0:
                  raise SystemExit("test module closing brace not found")
              text = text[:end] + insertion + text[end:]

          path.write_text(text)
          PY
      - run: cargo fmt --all
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - name: Commit MANIFEST V2 I/O fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "MANIFEST V2 I/O already finalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/forgedb-manifest/src/v2_log.rs
          git commit -m "fix(v0.4): enforce MANIFEST V2 no-clobber migration"
          git push origin HEAD:${{ github.head_ref }}

  test:
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --doc
      - run: cargo build --locked --workspace --release

  msrv:
    name: ubuntu / Rust 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
