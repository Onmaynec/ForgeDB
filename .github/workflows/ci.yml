name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  finalize-v04-merge:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/v0.4.0-leveled-compaction'
    name: finalize bounded compaction merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Complete tombstone metrics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/forgedb-lsm/src/merge.rs")
          text = path.read_text()

          old = '''        self.observe_input_group(&versions)?;
          let retained = retain_versions(versions, self.options);
          self.observe_output_group(&retained)?;
          self.pending.extend(retained);'''
          new = '''        self.observe_input_group(&versions)?;
          let input_tombstones = versions
              .iter()
              .filter(|entry| entry.internal_key.value_type() == ValueType::Deletion)
              .count();
          let retained = retain_versions(versions, self.options);
          let output_tombstones = retained
              .iter()
              .filter(|entry| entry.internal_key.value_type() == ValueType::Deletion)
              .count();
          let dropped_tombstones = input_tombstones
              .checked_sub(output_tombstones)
              .ok_or(Error::InternalInvariant {
                  invariant: "I-COMPACTION-DROPPED-TOMBSTONES",
                  reason: "output tombstones превышают input tombstones".to_owned(),
              })?;
          self.observe_output_group(&retained, dropped_tombstones)?;
          self.pending.extend(retained);'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("merge retention marker not found")

          old = '''    fn observe_output_group(&mut self, retained: &[TableEntry]) -> Result<()> {'''
          new = '''    fn observe_output_group(
              &mut self,
              retained: &[TableEntry],
              dropped_tombstones: usize,
          ) -> Result<()> {'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("observe_output_group signature not found")

          old = '''        self.stats.dropped_versions = dropped;
          Ok(())'''
          new = '''        self.stats.dropped_versions = dropped;
          self.stats.dropped_tombstones = checked_add(
              self.stats.dropped_tombstones,
              u64::try_from(dropped_tombstones).map_err(|_| Error::ResourceLimit {
                  resource: "compaction_dropped_tombstones",
                  limit: u64::MAX,
                  observed: u64::MAX,
              })?,
              "compaction_dropped_tombstones",
          )?;
          Ok(())'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("dropped tombstone counter marker not found")

          path.write_text(text)
          PY
      - run: cargo fmt --all
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - name: Commit canonical merge
        shell: bash
        run: |
          if git diff --quiet; then
            echo "bounded merge already finalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/forgedb-lsm
          git commit -m "feat(v0.4): finalize bounded merge metrics"
          git push origin HEAD:${{ github.head_ref }}

  test:
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --doc
      - run: cargo build --locked --workspace --release

  msrv:
    name: ubuntu / Rust 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
