name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fix-v010:
    name: одноразовое исправление v0.1.0
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/v0.1.0-durable-wal' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.1.0-durable-wal
          fetch-depth: 0
      - name: Исправить recovery и освобождение lock
        shell: python
        run: |
          from pathlib import Path

          log_path = Path("crates/forgedb-wal/src/log.rs")
          log_text = log_path.read_text(encoding="utf-8")
          old_sequence = '''        if decoded.sequence_start != expected_sequence {
              return Err(Error::corruption(
                  "WAL sequence",
                  format!(
                      "ожидалась sequence {}, найдена {}",
                      expected_sequence.get(),
                      decoded.sequence_start.get()
                  ),
              ));
          }
'''
          new_sequence = '''        if decoded.sequence_start < expected_sequence {
              return Err(Error::corruption(
                  "WAL sequence",
                  format!(
                      "sequence {} пересекает уже воспроизведённый диапазон до {}",
                      decoded.sequence_start.get(),
                      expected_sequence.get().saturating_sub(1)
                  ),
              ));
          }
'''
          if old_sequence not in log_text:
              raise SystemExit("sequence validation block was not found")
          log_path.write_text(
              log_text.replace(old_sequence, new_sequence),
              encoding="utf-8",
              newline="\n",
          )

          database_path = Path("crates/forgedb/src/database.rs")
          database_text = database_path.read_text(encoding="utf-8")
          replacements = [
              (
                  '''    fatal_write_error: Option<String>,
}''',
                  '''    fatal_write_error: Option<String>,
    lock: Option<NativeLockGuard>,
}''',
              ),
              (
                  '''    closed: AtomicBool,
    _lock: NativeLockGuard,
}''',
                  '''    closed: AtomicBool,
}''',
              ),
              (
                  '''                fatal_write_error: None,
            }),
            closed: AtomicBool::new(false),
            _lock: lock,
''',
                  '''                fatal_write_error: None,
                lock: Some(lock),
            }),
            closed: AtomicBool::new(false),
''',
              ),
              (
                  '''        if let Some(writer) = state.wal.take() {
            writer.sync()?;
        }
        Ok(())
''',
                  '''        if let Some(writer) = state.wal.take() {
            writer.sync()?;
        }
        state.lock.take();
        Ok(())
''',
              ),
          ]
          for old, new in replacements:
              if old not in database_text:
                  raise SystemExit(f"database replacement was not found: {old[:40]!r}")
              database_text = database_text.replace(old, new, 1)
          database_path.write_text(database_text, encoding="utf-8", newline="\n")
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --doc
      - run: cargo build --workspace --release
      - name: Опубликовать проверенный bot-коммит
        shell: bash
        run: |
          rm -f .github/workflows/v010-normalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: normalize WAL recovery and close semantics"
          git push origin HEAD:feature/v0.1.0-durable-wal

  test:
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --doc
      - run: cargo build --workspace --release

  msrv:
    name: ubuntu / Rust 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
