name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  integrate-version-set-v2:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/v0.4.0-leveled-compaction'
    name: integrate level-aware VersionSet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Add shared V1/V2 physical open path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/forgedb/src/version_set.rs")
          text = path.read_text()
          text = text.replace(
              "use forgedb_manifest::ManifestState;",
              "use forgedb_manifest::{ManifestState, ManifestStateV2};",
          )

          open_start = text.find("    pub(crate) fn open(\n")
          if open_start < 0:
              raise SystemExit("VersionSet open marker not found")
          next_method = text.find("    pub(crate) fn with_l0(", open_start)
          existing_v2 = text.find("    pub(crate) fn open_v2(", open_start)
          replacement_end = existing_v2 if existing_v2 >= 0 else next_method
          if replacement_end < 0:
              raise SystemExit("VersionSet next method marker not found")

          shared = '''    pub(crate) fn open(
              directory: &Path,
              identity: DatabaseId,
              manifest: &ManifestState,
              limits: &Limits,
              level_count: usize,
              max_file_size: u64,
          ) -> Result<Self> {
              if level_count < 2 {
                  return Err(Error::invalid_argument(
                      "level_count",
                      "VersionSet требует минимум L0 и L1",
                  ));
              }
              let mut bridge = ManifestStateV2::initial(
                  identity,
                  manifest.manifest_number,
                  manifest.log_number,
                  level_count,
              )?;
              bridge.comparator = manifest.comparator.clone();
              bridge.previous_log_number = manifest.previous_log_number;
              bridge.next_file_number = manifest.next_file_number;
              bridge.last_sequence = manifest.last_sequence;
              let level_zero = bridge.levels.first_mut().ok_or(Error::InternalInvariant {
                  invariant: "I-VERSIONSET-BRIDGE-L0",
                  reason: "level-aware bridge не содержит L0".to_owned(),
              })?;
              *level_zero = manifest.l0_files.clone();
              Self::open_v2(directory, identity, &bridge, limits, max_file_size)
          }

              pub(crate) fn open_v2(
                  directory: &Path,
                  identity: DatabaseId,
                  manifest: &ManifestStateV2,
                  limits: &Limits,
                  max_file_size: u64,
              ) -> Result<Self> {
                  manifest.validate(limits)?;
                  let filesystem = NativeFileSystem;
                  let mut levels = Vec::with_capacity(manifest.levels.len());
                  for metadata_level in &manifest.levels {
                      let mut level = Vec::with_capacity(metadata_level.len());
                      for metadata in metadata_level {
                          let reader = TableReader::open(
                              &filesystem,
                              directory,
                              identity,
                              metadata,
                              limits,
                              max_file_size,
                          )?;
                          level.push(TableHandle {
                              metadata: metadata.clone(),
                              reader: Arc::new(reader),
                          });
                      }
                      levels.push(level);
                  }
                  let version = Self {
                      directory: directory.to_path_buf(),
                      identity,
                      levels,
                      max_file_size,
                  };
                  version.validate(limits)?;
                  Ok(version)
              }

          '''
          if existing_v2 >= 0:
              after_v2 = text.find("    pub(crate) fn with_l0(", existing_v2)
              if after_v2 < 0:
                  raise SystemExit("with_l0 after open_v2 not found")
              text = text[:open_start] + shared + text[after_v2:]
          else:
              text = text[:open_start] + shared + text[next_method:]

          if "pub(crate) fn metadata_levels(&self)" not in text:
              marker = "    #[must_use]\n    pub(crate) fn file_count(&self)"
              index = text.find(marker)
              if index < 0:
                  raise SystemExit("VersionSet file_count marker not found")
              method = '''    #[must_use]
              pub(crate) fn metadata_levels(&self) -> Vec<Vec<TableMeta>> {
                  self.levels
                      .iter()
                      .map(|level| {
                          level
                              .iter()
                              .map(|table| table.metadata.clone())
                              .collect()
                      })
                      .collect()
              }

          '''
              text = text[:index] + method + text[index:]

          text = text.replace(
              '''    pub(crate) fn file_count(&self) -> usize {
                  self.levels.iter().map(Vec::len).sum()
              }''',
              '''    pub(crate) fn file_count(&self) -> usize {
                  self.metadata_levels().iter().map(Vec::len).sum()
              }''',
          )

          test_name = "fn v2_version_set_opens_physical_l0_and_l1_files()"
          if test_name not in text:
              insertion = '''

              #[test]
              fn v2_version_set_opens_physical_l0_and_l1_files() -> Result<()> {
                  use std::fs;
                  use std::time::{SystemTime, UNIX_EPOCH};

                  use forgedb_manifest::{LevelFile, VersionEditV2};
                  use forgedb_sstable::{
                      TableBuildOptions, TableBuildRequest, TableEntry, build_table,
                  };

                  let unique = SystemTime::now()
                      .duration_since(UNIX_EPOCH)
                      .unwrap_or_default()
                      .as_nanos();
                  let directory = std::env::temp_dir().join(format!(
                      "forgedb-version-set-v2-{}-{unique}",
                      std::process::id()
                  ));
                  fs::create_dir_all(&directory).map_err(|source| {
                      Error::io("create_test_directory", Some(directory.clone()), source)
                  })?;
                  let temporary = directory.join("TEMP");
                  let filesystem = NativeFileSystem;
                  let limits = Limits::default();
                  let identity = DatabaseId::random();
                  let options = TableBuildOptions {
                      data_block_size: 1024,
                      restart_interval: 16,
                      bloom_bits_per_key: 10,
                  };
                  let l0_entries = vec![TableEntry::value(
                      b"a".to_vec(),
                      SequenceNumber::new(2)?,
                      b"l0".to_vec(),
                      &limits,
                  )?];
                  let l1_entries = vec![TableEntry::value(
                      b"n".to_vec(),
                      SequenceNumber::FIRST,
                      b"l1".to_vec(),
                      &limits,
                  )?];
                  let l0 = build_table(
                      &filesystem,
                      TableBuildRequest::new(
                          &directory,
                          &temporary,
                          identity,
                          10,
                          &l0_entries,
                          &limits,
                          options,
                      ),
                  )?;
                  let l1 = build_table(
                      &filesystem,
                      TableBuildRequest::new(
                          &directory,
                          &temporary,
                          identity,
                          11,
                          &l1_entries,
                          &limits,
                          options,
                      ),
                  )?;
                  let state = ManifestStateV2::initial(identity, 2, 1, 3)?.applied(
                      &VersionEditV2 {
                          next_file_number: Some(12),
                          added_files: vec![
                              LevelFile {
                                  level: 0,
                                  metadata: l0.clone(),
                              },
                              LevelFile {
                                  level: 1,
                                  metadata: l1.clone(),
                              },
                          ],
                          ..VersionEditV2::default()
                      },
                      &limits,
                  )?;
                  let version = VersionSet::open_v2(
                      &directory,
                      identity,
                      &state,
                      &limits,
                      64 * 1024 * 1024,
                  )?;
                  assert_eq!(version.level_count(), 3);
                  assert_eq!(version.metadata_levels()[0], vec![l0]);
                  assert_eq!(version.metadata_levels()[1], vec![l1]);
                  assert_eq!(
                      version.get_at(
                          b"n",
                          Some(SequenceNumber::new(2)?),
                          &limits,
                          true,
                      )?,
                      TableSnapshotLookup::Value(b"l1".to_vec())
                  );
                  drop(version);
                  fs::remove_dir_all(&directory).map_err(|source| {
                      Error::io("remove_test_directory", Some(directory), source)
                  })?;
                  Ok(())
              }
          '''
              end = text.rfind("\n}")
              if end < 0:
                  raise SystemExit("VersionSet test module closing brace not found")
              text = text[:end] + insertion + text[end:]

          path.write_text(text)
          PY
      - run: cargo fmt --all
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - name: Commit level-aware VersionSet
        shell: bash
        run: |
          if git diff --quiet; then
            echo "VersionSet V2 already integrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/forgedb/src/version_set.rs
          git commit -m "feat(v0.4): share V1 and V2 VersionSet open path"
          git push origin HEAD:${{ github.head_ref }}

  test:
    name: ${{ matrix.os }} / stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --doc
      - run: cargo build --locked --workspace --release

  msrv:
    name: ubuntu / Rust 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
