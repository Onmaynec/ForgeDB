name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  enforce_read_only_inventory:
    name: enforce read-only inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v0.4.0-leveled-compaction
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Move obsolete cleanup to mutating paths
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          database = Path("crates/forgedb/src/database_v3_fixed.rs")
          text = database.read_text()
          text = replace_once(
              text,
              '''        self.apply_write_stall()?;
                  let mut state = self.lock_state()?;
                  ensure_writer_healthy(&state)?;''',
              '''        self.apply_write_stall()?;
                  let mut state = self.lock_state()?;
                  ensure_writer_healthy(&state)?;
                  self.collect_obsolete_ssts_locked(&mut state)?;''',
              "write cleanup boundary",
          )
          text = replace_once(
              text,
              '''        let (manifest, version) = {
                      let mut state = self.lock_state()?;
                      self.collect_obsolete_ssts_locked(&mut state)?;
                      (state.manifest.clone(), Arc::clone(&state.version))
                  };''',
              '''        let (manifest, version) = {
                      let state = self.lock_state()?;
                      (state.manifest.clone(), Arc::clone(&state.version))
                  };''',
              "read-only inventory boundary",
          )
          text = replace_once(
              text,
              '''    fn prepare_flush(&self, filesystem: &NativeFileSystem, limits: &Limits) -> Result<FlushWork> {
                  let mut state = self.lock_state()?;
                  ensure_writer_healthy(&state)?;''',
              '''    fn prepare_flush(&self, filesystem: &NativeFileSystem, limits: &Limits) -> Result<FlushWork> {
                  let mut state = self.lock_state()?;
                  ensure_writer_healthy(&state)?;
                  self.collect_obsolete_ssts_locked(&mut state)?;''',
              "flush cleanup boundary",
          )
          database.write_text(text)

          compaction = Path("crates/forgedb/src/database_compaction.rs")
          text = compaction.read_text()
          text = replace_once(
              text,
              '''        drop(iterator);
                  assert!(database.file_inventory()?.orphan_sst.is_empty());
                  database.close()?;''',
              '''        drop(iterator);
                  assert_eq!(database.file_inventory()?.orphan_sst.len(), 2);
                  database.put(b"cleanup-trigger", b"value", WriteOptions::sync())?;
                  assert!(database.file_inventory()?.orphan_sst.is_empty());
                  database.close()?;''',
              "inventory side-effect regression",
          )
          compaction.write_text(text)
          PY
      - run: cargo fmt --all
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --doc
      - run: cargo build --locked --workspace --release
      - name: Commit invariant correction
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/forgedb/src
          git commit -m "fix(v0.4): keep file inventory strictly read-only"
          git push origin HEAD:feature/v0.4.0-leveled-compaction
