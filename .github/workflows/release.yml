name: Foundation Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundation-release-v0.0.1
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'release: v0.0.1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --doc
      - run: cargo build --workspace --release
      - name: Create tag
        shell: bash
        run: |
          if git rev-parse "v0.0.1" >/dev/null 2>&1; then
            echo "Tag v0.0.1 already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v0.0.1 -m "ForgeDB v0.0.1 — Foundation"
            git push origin v0.0.1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.0.1 >/dev/null 2>&1; then
            echo "Release v0.0.1 already exists"
          else
            gh release create v0.0.1 \
              --title "ForgeDB v0.0.1 — Foundation" \
              --notes-file RELEASE_NOTES.md
          fi
