name: ForgeDB v0.8.1 Pre-release

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v0.8.1
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'release: v0.8.1')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.title == 'release: v0.8.1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Проверить метаданные выпуска
        shell: bash
        run: |
          grep -Fqx 'version = "0.8.1"' Cargo.toml
          test -s RELEASE_NOTES.md
          test -s docs/releases/V0.8.1.md
      - name: Проверить форматирование
        run: cargo fmt --all --check
      - name: Выполнить Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Выполнить тесты
        run: cargo test --locked --workspace --all-features
      - name: Выполнить doctests
        run: cargo test --locked --workspace --doc
      - name: Собрать release profile
        run: cargo build --locked --workspace --release
      - name: Проверить benchmark smoke
        run: cargo run --locked --release -p forgedb --example point_lookup_bench -- 256 1024
      - name: Создать аннотированный tag
        shell: bash
        run: |
          if git rev-parse "v0.8.1" >/dev/null 2>&1; then
            echo "Tag v0.8.1 уже существует"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v0.8.1 -m "ForgeDB v0.8.1 — SST Handle Cache and Reliability"
            git push origin v0.8.1
          fi
      - name: Создать GitHub Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.8.1 >/dev/null 2>&1; then
            echo "Release v0.8.1 уже существует"
          else
            gh release create v0.8.1 \
              --prerelease \
              --title "ForgeDB v0.8.1 — SST Handle Cache and Reliability" \
              --notes-file RELEASE_NOTES.md
          fi

  cli-binaries:
    name: CLI binary / ${{ matrix.os }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.8.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Собрать CLI
        run: cargo build --locked --release -p forgedb-cli
      - name: Упаковать Linux CLI и SHA256
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive=forgedb-v0.8.1-linux-x86_64.tar.gz
          tar -czf "$archive" -C target/release forgedb
          sha256sum "$archive" > "$archive.sha256"
      - name: Упаковать Windows CLI и SHA256
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "forgedb-v0.8.1-windows-x86_64.zip"
          Compress-Archive -Path "target/release/forgedb.exe" -DestinationPath $archive
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Path "$archive.sha256" -Encoding ascii
      - name: Загрузить готовые бинарники в GitHub Pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            archive=forgedb-v0.8.1-windows-x86_64.zip
          else
            archive=forgedb-v0.8.1-linux-x86_64.tar.gz
          fi
          for asset in "$archive" "$archive.sha256"; do
            if gh release view v0.8.1 --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              echo "Asset $asset уже опубликован"
            else
              gh release upload v0.8.1 "$asset"
            fi
          done
