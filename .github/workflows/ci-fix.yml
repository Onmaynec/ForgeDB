name: One-shot CI fix

on:
  push:
    branches: [agent/validate-v0.0.1]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/validate-v0.0.1
          fetch-depth: 0
      - name: Apply reviewed CI fixes
        shell: bash
        run: |
          git apply --check scripts/ci-fix.patch
          git apply scripts/ci-fix.patch
          rm scripts/ci-fix.patch .github/workflows/ci-fix.yml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --doc
      - run: cargo build --workspace --release
      - name: Publish validated fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: satisfy formatter and clippy"
          git push origin HEAD:agent/validate-v0.0.1
