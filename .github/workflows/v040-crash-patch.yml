name: v0.4 compaction crash patch

on:
  push:
    branches: [feature/v0.4.0-leveled-compaction]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v0.4.0-leveled-compaction
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/apply-v040-compaction-crash-matrix.py
      - run: cargo fmt --all
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --workspace --doc
      - run: cargo build --locked --workspace --release
      - name: Commit validated crash matrix
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/forgedb/src/database_compaction.rs crates/forgedb/src/database_compaction_crash_tests.rs crates/forgedb/src/lib.rs
          git commit -m "test(v0.4): cover compaction installation process crashes"
          git push origin HEAD:feature/v0.4.0-leveled-compaction
