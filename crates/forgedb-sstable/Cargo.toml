[package]
name = "forgedb-sstable"
description = "Версионируемые SSTable ForgeDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
forgedb-core = { path = "../forgedb-core" }
forgedb-fs = { path = "../forgedb-fs" }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
# Временные локальные исключения раннего SSTable V1. Не распространяются на workspace.
# Удалить после доступного полного rustfmt/refactor pass.
clone_on_copy = "allow"
too_many_arguments = "allow"
